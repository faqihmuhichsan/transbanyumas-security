<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Dark mode version -->
  <defs>
    <linearGradient id="shieldGradD" x1="0" y1="0" x2="60" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="busGradD" x1="0" y1="0" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  
  <!-- Shield Background -->
  <path d="M10 20 C10 12 16 6 24 6 L76 6 C84 6 90 12 90 20 L90 60 C90 78 60 100 50 106 C40 100 10 78 10 60 Z" fill="url(#shieldGradD)" stroke="#60A5FA" stroke-width="2"/>
  
  <!-- Inner Shield -->
  <path d="M18 24 C18 18 22 14 28 14 L72 14 C78 14 82 18 82 24 L82 56 C82 70 56 88 50 92 C44 88 18 70 18 56 Z" fill="#1E293B" opacity="0.4"/>
  
  <!-- Bus Icon -->
  <rect x="30" y="30" width="40" height="28" rx="6" fill="url(#busGradD)" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="34" y="34" width="14" height="10" rx="2" fill="#93C5FD"/>
  <rect x="52" y="34" width="14" height="10" rx="2" fill="#93C5FD"/>
  <rect x="28" y="48" width="44" height="6" rx="3" fill="#3B82F6"/>
  <circle cx="38" cy="60" r="4" fill="#475569" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="62" cy="60" r="4" fill="#475569" stroke="#E2E8F0" stroke-width="1.5"/>
  
  <!-- Security Star -->
  <polygon points="50,20 52,26 58,26 53,30 55,36 50,32 45,36 47,30 42,26 48,26" fill="#FCD34D" stroke="#F59E0B" stroke-width="0.5"/>
  
  <!-- Text: TRANS BANYUMAS -->
  <text x="110" y="45" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="900" font-size="28" fill="#F8FAFC" letter-spacing="1">
    TRANS
  </text>
  <text x="110" y="75" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="900" font-size="28" fill="#60A5FA" letter-spacing="1">
    BANYUMAS
  </text>
  
  <!-- Subtitle -->
  <text x="110" y="95" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" font-size="11" fill="#94A3B8" letter-spacing="2">
    SECURITY PATROL SYSTEM
  </text>
  
  <!-- Decorative Line -->
  <line x1="110" y1="80" x2="310" y2="80" stroke="#334155" stroke-width="1"/>
  
  <!-- BRT Badge -->
  <rect x="310" y="22" width="70" height="24" rx="12" fill="#3B82F6"/>
  <text x="345" y="39" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    BRT
  </text>
  
  <!-- Shield icon -->
  <text x="310" y="75" font-size="20">🛡️</text>
  <text x="335" y="72" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#94A3B8">
    SECURE
  </text>
</svg>
